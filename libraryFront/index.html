<html lang="pt-br">

  <meta charset="UTF-8" />

    rel="stylesheet"
  />

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

</head>

<body class="bg-light">

  <nav class="navbar navbar-expand-lg bg-primary">
  <div class="container-fluid">
    <a class="navbar-brand" href="#">Livraria Mipibu</a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNavDropdown" aria-controls="navbarNavDropdown" aria-expanded="false" aria-label="Toggle navigation">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="navbarNavDropdown">
  <ul class="navbar-nav">

    <li class="nav-item">
      <a class="nav-link active" href="index.html">Cadastro</a>
    </li>

    <li class="nav-item dropdown">
      <a class="nav-link dropdown-toggle" href="#" role="button" data-bs-toggle="dropdown">
        Autores
      </a>
      <ul class="dropdown-menu">
        <li><a class="dropdown-item" href="autores.html">Listar</a></li>
        <li><a class="dropdown-item" href="editar-autor.html">Editar</a></li>
        <li><a class="dropdown-item" href="excluir-autor.html">Excluir</a></li>
      </ul>
    </li>

    <li class="nav-item dropdown">
      <a class="nav-link dropdown-toggle" href="#" role="button" data-bs-toggle="dropdown">
        Livros
      </a>
      <ul class="dropdown-menu">
        <li><a class="dropdown-item" href="livros.html">Listar</a></li>
        <li><a class="dropdown-item" href="editar-livro.html">Editar</a></li>

      </ul>
    </li>

  </ul>
</div>

</nav>

  <!-- Conteúdo -->
  <div class="container mt-5">
    <div class="row justify-content-center">
      <div class="col-md-6">

        <div class="card shadow">
          <div class="card-body">
            <h4 class="card-title mb-4">Cadastro de Autor</h4>

            <form id="autorForm">
              <div class="mb-3">
                <label class="form-label">Nome</label>
                <input type="text" class="form-control" id="nome" required />
              </div>

              <div class="mb-3">
                <label class="form-label">Nacionalidade</label>
                <input type="text" class="form-control" id="nacionalidade" required />
              </div>

              <div class="mb-3">
                <label class="form-label">Data de nascimento</label>
                <input type="date" class="form-control" id="dataNascimento" required />
              </div>

              <button type="submit" class="btn btn-primary w-100">
                Salvar Autor
              </button>
            </form>

            <div id="mensagem" class="mt-3"></div>

          </div>
        </div>

      </div>
    </div>
  </div>

  <script src="js/api.js"></script>
  <script src="js/autores.js"></script>
</body>
