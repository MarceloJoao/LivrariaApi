<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8" />
  <title>Library API - Autores</title>

  <!-- Bootstrap CSS -->
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
    rel="stylesheet"
  />
</head>

<body class="bg-light">

  <!-- NAVBAR -->
  <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
    <div class="container-fluid">
      <a class="navbar-brand" href="index.html">Livraria Mipibu</a>

      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
        <span class="navbar-toggler-icon"></span>
      </button>

      <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-nav">
          <li class="nav-item">
            <a class="nav-link" href="index.html">Cadastro</a>
          </li>
          <li class="nav-item">
            <a class="nav-link active" href="autores.html">Autores</a>
          </li>
        </ul>
      </div>
    </div>
  </nav>

  <!-- CONTEÚDO -->
  <div class="container mt-5">

    <div class="card shadow">
      <div class="card-body">

        <h4 class="card-title mb-4">Lista de Autores</h4>

        <table class="table table-striped table-hover align-middle">
          <thead class="table-dark">
            <tr>
              <th>Nome</th>
              <th>Nacionalidade</th>
              <th>Data de Nascimento</th>
              <th style="width: 160px;">Ações</th>
            </tr>
          </thead>

          <tbody id="tabelaAutores">
            <!-- preenchido via JS -->
          </tbody>
        </table>

        <div id="mensagem" class="mt-3"></div>

      </div>
    </div>

  </div>

  <!-- MODAL EDITAR AUTOR -->
  <div class="modal fade" id="modalEditarAutor" tabindex="-1">
    <div class="modal-dialog">
      <div class="modal-content">

        <div class="modal-header">
          <h5 class="modal-title">Editar Autor</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>

        <div class="modal-body">
          <input type="hidden" id="editId">

          <div class="mb-3">
            <label class="form-label">Nome</label>
            <input type="text" id="editNome" class="form-control" required>
          </div>

          <div class="mb-3">
            <label class="form-label">Nacionalidade</label>
            <input type="text" id="editNacionalidade" class="form-control" required>
          </div>

          <div class="mb-3">
            <label class="form-label">Data de nascimento</label>
            <input type="date" id="editDataNascimento" class="form-control" required>
          </div>
        </div>

        <div class="modal-footer">
          <button class="btn btn-secondary" data-bs-dismiss="modal">
            Cancelar
          </button>
          <button class="btn btn-primary" id="btnSalvarEdicao">
            Salvar
          </button>
        </div>

      </div>
    </div>
  </div>

  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

  <!-- JS -->
  <script src="js/api.js"></script>
  <script src="js/autores-listar.js"></script>

</body>
</html>
