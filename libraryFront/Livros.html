<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>Livros</title>

  <!-- Bootstrap CSS -->
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
    rel="stylesheet"
  />
</head>

<body class="bg-light">

<!-- Navbar -->
<nav class="navbar navbar-expand-lg bg-primary navbar-dark">
  <div class="container-fluid">
    <a class="navbar-brand" href="index.html">Livraria Mipibu</a>
  </div>
</nav>

<!-- Conteúdo -->
<div class="container mt-5">

  <div class="card shadow">
    <div class="card-body">

      <h4 class="card-title mb-4">Cadastrar Livro</h4>

      <!-- FORMULÁRIO -->
      <form id="formLivro">

        <div class="mb-3">
          <label class="form-label">Título</label>
          <input type="text" id="titulo" class="form-control" required>
        </div>

        <div class="mb-3">
          <label class="form-label">ISBN</label>
          <input type="text" id="isbn" class="form-control" required>
        </div>

        <div class="mb-3">
          <label class="form-label">Data de Publicação</label>
          <input type="date" id="dataPublicacao" class="form-control">
        </div>

        <div class="mb-3">
          <label class="form-label">Gênero</label>
          <select id="genero" class="form-select" required>
            <option value="">Selecione</option>
            <option value="ROMANCE">ROMANCE</option>
            <option value="FANTASIA">Fantasia</option>
            <option value="TECNOLOGIA">Tecnologia</option>
            <option value="OUTROS">Outros</option>
          </select>
        </div>

        <div class="mb-3">
          <label class="form-label">Preço</label>
          <input
            type="number"
            step="0.01"
            id="preco"
            class="form-control"
          >
        </div>

        <div class="mb-3">
          <label class="form-label">Autor</label>
          <select id="autorId" class="form-select" required>
            <option value="">Carregando autores...</option>
          </select>
        </div>

        <button type="submit" class="btn btn-primary">
          Salvar
        </button>

      </form>

      <!-- MENSAGEM -->
      <div id="mensagem" class="mt-3"></div>

    </div>
  </div>

</div>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

<!-- JS -->
<script src="js/api.js"></script>
<script src="js/livros.js"></script>

</body>
</html>
