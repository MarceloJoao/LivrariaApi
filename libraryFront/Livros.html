<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>Cadastrar Livro</title>

  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
    rel="stylesheet"
  />
</head>

<body class="bg-light">

<nav class="navbar navbar-expand-lg bg-primary navbar-dark">
  <div class="container-fluid">
    <a class="navbar-brand" href="index.html">Livraria Mipibu</a>
    <div class="navbar-nav">
      <a class="nav-link active" href="livros.html">Cadastrar Livro</a>
      <a class="nav-link" href="livros-listar.html">Listar Livros</a>
      <a class="nav-link" href="Autores.html">Listar Autores</a>
    </div>
  </div>
</nav>

<div class="container mt-5">

  <div class="card shadow">
    <div class="card-body">

      <h4 class="card-title mb-4">Cadastrar Novo Livro</h4>

      <form id="formLivro">

        <div class="mb-3">
          <label class="form-label">Título</label>
          <input type="text" id="titulo" class="form-control" required placeholder="Ex: O Senhor dos Anéis">
        </div>

        <div class="mb-3">
          <label class="form-label">ISBN</label>
          <input type="text" id="isbn" class="form-control" required placeholder="Ex: 978-3-16-148410-0">
        </div>

        <div class="mb-3">
          <label class="form-label">Data de Publicação</label>
          <input type="date" id="dataPublicacao" class="form-control">
        </div>

        <div class="mb-3">
          <label class="form-label">Gênero</label>
          <select id="genero" class="form-select" required>
            <option value="">Selecione um gênero</option>
            <option value="FICCAO">Ficção</option>
            <option value="FANTASIA">Fantasia</option>
            <option value="MISTERIO">Mistério</option>
            <option value="ROMANCE">Romance</option>
            <option value="BIOGRAFIA">Biografia</option>
            <option value="CIENCIA">Ciência</option>
          </select>
        </div>

        <div class="mb-3">
          <label class="form-label">Preço</label>
          <input
            type="number"
            step="0.01"
            id="preco"
            class="form-control"
            placeholder="0.00"
          >
        </div>

        <div class="mb-3">
          <label class="form-label">Autor</label>
          <select id="autorId" class="form-select" required>
            <option value="">Carregando autores...</option>
          </select>
        </div>

        <hr>

        <div class="d-grid gap-2">
          <button type="submit" class="btn btn-primary">
            Salvar Livro
          </button>
          <a href="livros-listar.html" class="btn btn-outline-secondary">Ver Lista</a>
        </div>

      </form>

      <div id="mensagem" class="mt-3"></div>

    </div>
  </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

<script src="js/api.js"></script>
<script src="js/livros.js"></script>

</body>
</html>
