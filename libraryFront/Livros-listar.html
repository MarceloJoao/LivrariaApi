<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>Lista de Livros</title>

  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
    rel="stylesheet"
  />
</head>

<body class="bg-light">

<!-- Navbar -->
<nav class="navbar navbar-expand-lg bg-primary navbar-dark">
  <div class="container-fluid">
    <a class="navbar-brand" href="index.html">Livraria Mipibu</a>
    <div class="navbar-nav">
      <a class="nav-link" href="livros.html">Cadastrar Livro</a>
      <a class="nav-link active" href="livros-listar.html">Listar Livros</a>
    </div>
  </div>
</nav>

<div class="container mt-5">

  <div class="card shadow">
    <div class="card-body">

      <h4 class="card-title mb-4">Lista de Livros</h4>

      <table class="table table-striped table-hover">
        <thead class="table-dark">
          <tr>
            <th>Título</th>
            <th>Autor</th>
            <th>Gênero</th>
            <th>Preço</th>
            <th>Ações</th>
          </tr>
        </thead>

        <tbody id="tabelaLivros">
          <!-- livros aqui -->
        </tbody>
      </table>

      <div id="mensagem" class="mt-3"></div>

    </div>
  </div>

</div>

<!-- Modal Editar Livro -->
<div class="modal fade" id="modalEditarLivro" tabindex="-1">
  <div class="modal-dialog">
    <div class="modal-content">

      <div class="modal-header">
        <h5 class="modal-title">Editar Livro</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>

      <div class="modal-body">
        <input type="hidden" id="editLivroId">

        <div class="mb-3">
          <label class="form-label">Título</label>
          <input type="text" id="editTitulo" class="form-control">
        </div>

        <div class="mb-3">
          <label class="form-label">ISBN</label>
          <input type="text" id="editIsbn" class="form-control">
        </div>

        <div class="mb-3">
          <label class="form-label">Data de Publicação</label>
          <input type="date" id="editDataPublicacao" class="form-control">
        </div>

        <div class="mb-3">
          <label class="form-label">Gênero</label>
          <select id="editGenero" class="form-select">
            <option value="ROMANCE">Romance</option>
            <option value="FANTASIA">Fantasia</option>
            <option value="TECNOLOGIA">Tecnologia</option>
            <option value="OUTROS">Outros</option>
          </select>
        </div>

        <div class="mb-3">
          <label class="form-label">Preço</label>
          <input type="number" step="0.01" id="editPreco" class="form-control">
        </div>

        <div class="mb-3">
          <label class="form-label">Autor</label>
          <select id="editAutorId" class="form-select"></select>
        </div>
      </div>

      <div class="modal-footer">
        <button class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
        <button class="btn btn-primary" id="btnSalvarEdicaoLivro">
          Salvar
        </button>
      </div>

    </div>
  </div>
</div>


<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

<script src="js/api.js"></script>
<script src="js/livros-listar.js"></script>

</body>
</html>
